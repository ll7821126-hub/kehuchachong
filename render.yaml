services:
  - type: web
    name: customer-registry
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: customer-registry-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
databases:
  - name: customer-registry-db
    databaseName: customer_registry
    plan: free

